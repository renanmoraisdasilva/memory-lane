name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: File-size gate
        run: npm run check:file-size

      - name: Architecture boundaries
        run: npm run depcruise

      - name: Unused files and dependencies
        run: npm run knip

      - name: Unit, component, and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  electron:
    name: Electron E2E and Windows package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned native binaries
        run: npm run fetch:binaries

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild:electron

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test

      - name: Package Windows installer and portable ZIP
        run: npx electron-builder --win nsis portable

      - name: Verify package artifacts
        run: npm run verify:package

      - name: Packaged-app smoke test
        run: npm run smoke:packaged

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-lane-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
